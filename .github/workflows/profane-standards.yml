name: Profane Standards (Guild Gatekeeper)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: 🛡️ Quality Gate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Lint
        run: npm run lint --if-present || echo "::warning::Lint issues"
        
      - name: Test
        run: npm test --if-present || echo "::warning::Tests failed"

  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit
        run: npm audit --audit-level=high || echo "::warning::Audit reported issues"

  build:
    name: 🏗️ Production Build
    needs: [quality, security]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build --if-present || echo "::warning::Build failed"
